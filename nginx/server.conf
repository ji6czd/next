server {
    listen 80;
    server_name your-domain.com; # あなたのドメインまたはIP
    # ドキュメントルート（distフォルダの中身を置いた場所）
    root /var/www/nanikuru/dist;
    index index.html;
    # 1. SPA設定: ファイルが存在しなければ index.html を返す
    location / {
        try_files $uri $uri/ /index.html;
    }
    # 2. リバースプロキシ設定: /api/yahoo へのリクエストを中継
    location /api/yahoo/ {
        # /api/yahoo/hogehoge -> https://transit.yahoo.co.jp/hogehoge に変換
        rewrite ^/api/yahoo/(.*)$ /$1 break;
        # 転送先
        proxy_pass https://transit.yahoo.co.jp;
        # 相手(Yahoo)に正しいホスト名でアクセスしているように見せる（重要）
        proxy_ssl_server_name on;
        proxy_set_header Host transit.yahoo.co.jp;
        # 相手にブラウザからのアクセスだと思わせる（User-Agent偽装）
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        # 圧縮されていると置換などが面倒になる場合があるため無効化（今回は不要かもですが念の為）
        proxy_set_header Accept-Encoding "";
        # クライアント側のIPなどを隠してサーバーからのアクセスに見せる
        proxy_hide_header Access-Control-Allow-Origin;
        # 自分のサイトからのアクセス許可（CORS回避のキモ）
        # 必要に応じて厳密なドメインを指定してください
        add_header Access-Control-Allow-Origin *;
    }
}
